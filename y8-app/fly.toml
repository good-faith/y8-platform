# y8-app — Next.js wallet UI (SSR, port 3000)
app = 'y8-web-jason-sprouse'
primary_region = 'sjc'

[build]
  dockerfile = '../docker/web.Dockerfile'

  [build.args]
    NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID = 'b56e18d47c72ab683b10814fe9495694'
    NEXT_PUBLIC_Y8_SERVER_URL = 'https://y8-server-jason-sprouse.fly.dev/api/v1'
    NEXT_PUBLIC_Y8_PREMIER_URL = 'https://y8-premier-jason-sprouse.fly.dev'
    NEXT_PUBLIC_THE_BEACH_URL = 'https://y8-beach-jason-sprouse.fly.dev'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  NEXT_TELEMETRY_DISABLED = '1'
  NEXTAUTH_URL = 'https://y8-web-jason-sprouse.fly.dev'
  NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID = 'b56e18d47c72ab683b10814fe9495694'
  NEXT_PUBLIC_Y8_SERVER_URL = 'https://y8-server-jason-sprouse.fly.dev/api/v1'
  NEXT_PUBLIC_Y8_PREMIER_URL = 'https://y8-premier-jason-sprouse.fly.dev'
  NEXT_PUBLIC_THE_BEACH_URL = 'https://y8-beach-jason-sprouse.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

[[services]]
  protocol = 'tcp'
  internal_port = 3000

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
