name: Deploy to Fly.io

on:
  push:
    branches: [staging]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy (all, server, beach, web, premier)'
        required: false
        default: 'all'
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'

jobs:
  deploy:
    name: Deploy ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: y8-server
            short: server
            config: y8-server/fly.toml
            dockerfile: docker/server.Dockerfile
            fly_app: y8-server-jason-sprouse
          - name: y8-beach
            short: beach
            config: the-beach/fly.toml
            dockerfile: docker/beach.Dockerfile
            fly_app: y8-beach-jason-sprouse
          - name: y8-web
            short: web
            config: y8-app/fly.toml
            dockerfile: docker/web.Dockerfile
            fly_app: y8-web-jason-sprouse
          - name: y8-premier
            short: premier
            config: y8-premier/fly.toml
            dockerfile: docker/premier.Dockerfile
            fly_app: y8-premier-jason-sprouse

    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.app || inputs.app == 'all' || inputs.app == matrix.app.short || inputs.app == matrix.app.name }}

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: ${{ !inputs.app || inputs.app == 'all' || inputs.app == matrix.app.short || inputs.app == matrix.app.name }}

      - name: Deploy ${{ matrix.app.name }}
        if: ${{ !inputs.app || inputs.app == 'all' || inputs.app == matrix.app.short || inputs.app == matrix.app.name }}
        run: flyctl deploy . --config ${{ matrix.app.config }} --dockerfile ${{ matrix.app.dockerfile }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Show app URL
        if: ${{ !inputs.app || inputs.app == 'all' || inputs.app == matrix.app.short || inputs.app == matrix.app.name }}
        run: flyctl status --app ${{ matrix.app.fly_app }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Print all URLs
        run: |
          echo '## Fly.io Deployment 🚀' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          for app in y8-server-jason-sprouse y8-beach-jason-sprouse y8-web-jason-sprouse y8-premier-jason-sprouse; do
            url=$(flyctl info --app $app --json 2>/dev/null | jq -r '.Hostname // "pending"')
            echo "- **${app}**: https://${url}" >> $GITHUB_STEP_SUMMARY
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
