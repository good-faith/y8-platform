name: Deploy to Fly.io

on:
  push:
    branches: [staging]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy (all, server, beach, web, premier)'
        required: false
        default: 'all'
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'

jobs:
  deploy:
    name: Deploy ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: y8-server
            config: y8-server/fly.toml
            fly_app: y8-server
          - name: y8-beach
            config: the-beach/fly.toml
            fly_app: y8-beach
          - name: y8-web
            config: y8-app/fly.toml
            fly_app: y8-web
          - name: y8-premier
            config: y8-premier/fly.toml
            fly_app: y8-premier

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy ${{ matrix.app.name }}
        run: flyctl deploy --config ${{ matrix.app.config }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Show app URL
        run: flyctl status --app ${{ matrix.app.fly_app }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Print all URLs
        run: |
          echo '## Fly.io Deployment 🚀' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          for app in y8-server y8-beach y8-web y8-premier; do
            url=$(flyctl info --app $app --json 2>/dev/null | jq -r '.Hostname // "pending"')
            echo "- **${app}**: https://${url}" >> $GITHUB_STEP_SUMMARY
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
