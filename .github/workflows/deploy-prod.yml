name: Deploy → Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. v1.2.3)'
        required: true

env:
  GCP_REGION: us-central1
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  REGISTRY: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/y8-prod
  WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  WIF_SA: ${{ secrets.GCP_SERVICE_ACCOUNT_PROD }}

jobs:
  build-and-push:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Get image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - uses: docker/setup-buildx-action@v3

      - name: Build & push all production images
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          for app in server beach web premier; do
            docker buildx build \
              --file docker/${app}.Dockerfile \
              --tag ${{ env.REGISTRY }}/${app}:${TAG} \
              --push \
              --cache-from type=gha,scope=${app} \
              --cache-to type=gha,mode=max,scope=${app} \
              .
          done

  terraform-prod:
    name: Terraform Apply → Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # Requires manual approval in GitHub
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Terraform init
        run: terraform init
        working-directory: infra/environments/prod

      - name: Terraform plan
        run: |
          terraform plan \
            -var="project_id=${{ env.GCP_PROJECT }}" \
            -var="app_image_tag=${{ needs.build-and-push.outputs.image_tag }}" \
            -var="github_org=${{ github.repository_owner }}" \
            -out=tfplan
        working-directory: infra/environments/prod

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
        working-directory: infra/environments/prod

      - name: Production deployment summary
        run: |
          echo '## Production Deployed 🚀' >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.build-and-push.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          terraform output -json | jq -r '.prod_urls.value | to_entries[] | "- **\(.key)**: \(.value)"' >> $GITHUB_STEP_SUMMARY
        working-directory: infra/environments/prod
