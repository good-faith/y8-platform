services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: y8
      POSTGRES_USER: y8user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-y8devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U y8user -d y8"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - y8-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-y8redispassword}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - y8-network

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      DATABASE_URL: postgresql://y8user:${POSTGRES_PASSWORD:-y8devpassword}@postgres:5432/y8
      REDIS_URL: redis://:${REDIS_PASSWORD:-y8redispassword}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - y8-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  beach:
    build:
      context: .
      dockerfile: docker/beach.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      REDIS_URL: redis://:${REDIS_PASSWORD:-y8redispassword}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - y8-network

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NEXT_PUBLIC_Y8_API_URL: ${Y8_API_URL:-http://server:3001}
    depends_on:
      - server
    networks:
      - y8-network

  premier:
    build:
      context: .
      dockerfile: docker/premier.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      Y8_API_URL: ${Y8_API_URL:-http://server:3001}
    depends_on:
      - server
    networks:
      - y8-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - server
      - premier
      - beach
    networks:
      - y8-network

volumes:
  postgres_data:
  redis_data:

networks:
  y8-network:
    driver: bridge
