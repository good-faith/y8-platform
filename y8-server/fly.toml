# y8-server — NestJS API (port 3001)
app = 'y8-server-jason-sprouse'
primary_region = 'sjc'

[build]
  dockerfile = '../docker/server.Dockerfile'
  build_target = 'runner'

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  ALLOWED_ORIGINS = 'https://y8-web-jason-sprouse.fly.dev,https://y8-premier-jason-sprouse.fly.dev,https://y8-beach-jason-sprouse.fly.dev,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

[[services]]
  protocol = 'tcp'
  internal_port = 3001

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  # WebSocket upgrade support
  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
