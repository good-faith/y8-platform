events {
  worker_connections 1024;
}

http {
  upstream web      { server web:3000; }
  upstream server   { server server:3001; }
  upstream premier  { server premier:3002; }
  upstream beach    { server beach:3003; }

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  server {
    listen 80;
    server_name _;

    # y8-app — wallet UI
    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # y8-server — platform API
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://server;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # WebSocket support
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # y8-premier — financial dashboard
    location /financial {
      proxy_pass http://premier;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # the-beach — XR island
    location /xr {
      proxy_pass http://beach;
      proxy_set_header Host $host;
      # WebSocket + Socket.IO
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 86400;
    }

    # Socket.IO for beach
    location /socket.io/ {
      proxy_pass http://beach;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 86400;
    }
  }
}
